services:
  db:
    image: postgres:16-alpine
    container_name: finmentor_db
    environment:
      POSTGRES_USER: finmentor
      POSTGRES_PASSWORD: finmentor_password
      POSTGRES_DB: finmentor_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U finmentor -d finmentor_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finmentor_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://finmentor:finmentor_password@db:5432/finmentor_db
      SECRET_KEY: super-secret-finmentor-jwt-key-2026
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finmentor_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:

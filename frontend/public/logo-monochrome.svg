<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <g transform="translate(10, 0)">
    <!-- Icon part (originally 100x100, scaled down to 56x56 and offset to center vertically) -->
    <g transform="translate(0, 12) scale(0.56)">
      
  <!-- Outer F-Shape -->
  <path d="M 25 75 V 30 A 5 5 0 0 1 30 25 H 75" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Rising trend line / middle of F -->
  <path d="M 25 50 C 33 50 35 57 39 57 C 45 57 49 42 53 42 C 59 42 63 28 72 28" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Arrow Head -->
  <path d="M 78 22 L 66 22 L 78 34 Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Three Ascending Bars -->
  <path d="M 39 75 V 65 M 53 75 V 53 M 67 75 V 41" stroke="currentColor" stroke-width="10" stroke-linecap="round" fill="none" />

    </g>
    
    <!-- Wordmark -->
    <text x="68" y="49" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="29" letter-spacing="-0.5" fill="currentColor">
      <tspan font-weight="600">Fin</tspan><tspan font-weight="500" opacity="0.85">Mentor</tspan>
    </text>
  </g>
</svg>